[project]
name = "ai-data-agent"
version = "0.1.0"
description = "Assistant local SQL et ETL en langage naturel, avec LangGraph et interface de bureau."
readme = "README.md"
authors = [
    { name = "IlyassRbaai", email = "ilyassrbai@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pandas>=3.0.6",
    "requests>=2.32",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
